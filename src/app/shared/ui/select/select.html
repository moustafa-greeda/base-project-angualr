<div class="relative" (appClickOutside)="close()">
  <!-- ══════════ trigger ══════════ -->
  <button
    type="button"
    class="flex w-full cursor-pointer items-center gap-2 rounded-[10px] border bg-[var(--bg)] px-3.5 py-2.5 text-start text-sm outline-none transition focus:ring-[3px] focus:ring-[var(--primary)]/15 disabled:cursor-not-allowed disabled:opacity-60"
    [class]="
      open()
        ? 'border-[var(--primary)]'
        : 'border-[var(--border-color)] hover:border-[var(--primary)]/50'
    "
    [disabled]="disabled()"
    (click)="toggle()"
    (keydown)="onKeydown($event)"
    role="combobox"
    [attr.aria-expanded]="open()"
    aria-haspopup="listbox"
  >
    <span class="flex min-w-0 flex-1 flex-wrap items-center gap-1.5">
      @if (multiple() && selectedOptions().length) {
        <!-- one chip per selection -->
        @for (o of selectedOptions(); track o.value) {
          <span
            class="inline-flex items-center gap-1 rounded-md bg-[var(--primary)]/12 px-2 py-0.5 text-xs font-medium text-[var(--primary)]"
          >
            {{ o.label }}
            <span
              role="button"
              tabindex="-1"
              class="cursor-pointer opacity-60 transition-opacity hover:opacity-100"
              [attr.aria-label]="'Remove ' + o.label"
              (click)="remove(o, $event)"
            >
              <i class="bi bi-x-lg text-[0.6rem]"></i>
            </span>
          </span>
        }
      } @else if (triggerLabel()) {
        <span class="truncate text-[var(--text-color)]">{{ triggerLabel() }}</span>
      } @else {
        <span class="truncate text-[var(--muted)]">{{ placeholder() }}</span>
      }
    </span>

    @if (selectedOptions().length && !disabled()) {
      <span
        role="button"
        tabindex="-1"
        class="shrink-0 cursor-pointer text-[var(--muted)] transition-colors hover:text-[var(--danger)]"
        aria-label="Clear selection"
        (click)="clear($event)"
      >
        <i class="bi bi-x-circle-fill text-xs"></i>
      </span>
    }
    <i
      class="bi bi-chevron-down shrink-0 text-[0.7rem] text-[var(--muted)] transition-transform duration-200"
      [class.rotate-180]="open()"
    ></i>
  </button>

  <!-- ══════════ panel ══════════ -->
  @if (open()) {
    <div
      class="animate-dropdown-in absolute inset-x-0 top-[calc(100%+6px)] z-50 overflow-hidden rounded-xl border border-[var(--border-color)] bg-[var(--card-bg)] shadow-xl"
      role="listbox"
    >
      @if (showSearch()) {
        <div class="border-b border-[var(--border-color)] p-2">
          <div class="relative">
            <i
              class="bi bi-search pointer-events-none absolute start-3 top-1/2 -translate-y-1/2 text-xs text-[var(--muted)]"
            ></i>
            <input
              #searchBox
              type="text"
              [placeholder]="searchPlaceholder()"
              [value]="search()"
              (input)="onSearchInput($any($event.target).value)"
              (keydown)="onKeydown($event)"
              class="w-full rounded-lg border border-[var(--border-color)] bg-[var(--bg)] px-3 py-2 ps-8 text-sm text-[var(--text-color)] outline-none focus:border-[var(--primary)]"
            />
          </div>
        </div>
      }

      <ul class="max-h-60 overflow-y-auto p-1">
        @for (o of visibleOptions(); track o.value; let i = $index) {
          <li>
            <button
              type="button"
              role="option"
              [attr.aria-selected]="isSelected(o)"
              [disabled]="o.disabled"
              (click)="select(o)"
              (mouseenter)="activeIndex.set(i)"
              class="flex w-full cursor-pointer items-center gap-2.5 rounded-lg px-3 py-2 text-start text-sm transition-colors disabled:cursor-not-allowed disabled:opacity-40"
              [class]="
                i === activeIndex() ? 'bg-[var(--row-hover)]' : ''
              "
            >
              @if (multiple()) {
                <span class="cbx pointer-events-none">
                  <input type="checkbox" [checked]="isSelected(o)" tabindex="-1" />
                  <span class="cbx-box"><i class="bi bi-check-lg"></i></span>
                </span>
              }

              <span class="min-w-0 flex-1">
                <span
                  class="block truncate"
                  [class]="
                    isSelected(o)
                      ? 'font-medium text-[var(--primary)]'
                      : 'text-[var(--text-color)]'
                  "
                >
                  {{ o.label }}
                </span>
                @if (o.hint) {
                  <span class="block truncate text-xs text-[var(--muted)]">{{ o.hint }}</span>
                }
              </span>

              @if (!multiple() && isSelected(o)) {
                <i class="bi bi-check-lg shrink-0 text-[var(--primary)]"></i>
              }
            </button>
          </li>
        } @empty {
          <li class="px-3 py-6 text-center text-sm text-[var(--muted)]">{{ emptyText() }}</li>
        }
      </ul>
    </div>
  }
</div>
