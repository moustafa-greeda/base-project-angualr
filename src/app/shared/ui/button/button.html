<ng-template #content>
  @if (loading()) {
    <!-- spinner takes the icon slot; label stays visible -->
    <span
      class="size-4 shrink-0 animate-spin rounded-full border-2 border-current border-t-transparent"
    ></span>
  } @else if (showIcon() && icon()) {
    <i [class]="icon()"></i>
  }

  @if (titleBtn() && !iconOnly()) {
    <span>{{ titleBtn() }}</span>
  }
  <ng-content></ng-content>
</ng-template>

@if (link(); as target) {
  <a
    [routerLink]="target"
    [class]="classes()"
    [attr.aria-label]="ariaLabelValue()"
    [attr.title]="ariaLabelValue()"
  >
    <ng-container [ngTemplateOutlet]="content" />
  </a>
} @else {
  <button
    [type]="type()"
    [class]="classes()"
    [disabled]="disabled() || loading()"
    (click)="clickEvt()"
    [attr.aria-label]="ariaLabelValue()"
    [attr.title]="ariaLabelValue()"
  >
    <ng-container [ngTemplateOutlet]="content" />
  </button>
}
