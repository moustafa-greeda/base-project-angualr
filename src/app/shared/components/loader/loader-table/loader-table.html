<div
  class="overflow-hidden rounded-2xl border border-[var(--border-color)] bg-[var(--card-bg)] shadow-sm"
  aria-busy="true"
  aria-label="Loading table"
>
  <!-- toolbar (search) -->
  <div class="p-4">
    <span class="skeleton block h-10 w-full max-w-[400px] rounded-[10px]"></span>
  </div>

  <!-- header row -->
  <div
    class="flex items-center gap-4 border-y border-[var(--border-color)] bg-[var(--table-head-bg)] px-4 py-4"
  >
    @for (c of colsArr(); track c) {
      <span class="flex-1">
        <span class="skeleton block h-3" [style.width.%]="45"></span>
      </span>
    }
  </div>

  <!-- body rows -->
  @for (r of rowsArr(); track r) {
    <div
      class="flex items-center gap-4 border-b border-[var(--border-color)] px-4 py-4 last:border-b-0"
    >
      @for (c of colsArr(); track c) {
        <span class="flex-1">
          <span class="skeleton block h-4" [style.width.%]="cellWidth(r, c)"></span>
        </span>
      }
    </div>
  }

  <!-- footer (pagination) -->
  <div
    class="flex flex-wrap items-center justify-between gap-3 border-t border-[var(--border-color)] px-4 py-3"
  >
    <span class="skeleton h-3 w-40"></span>
    <span class="flex items-center gap-1.5">
      @for (p of [1, 2, 3, 4]; track p) {
        <span class="skeleton size-9 rounded-lg"></span>
      }
    </span>
    <span class="skeleton h-8 w-24 rounded-lg"></span>
  </div>
</div>
