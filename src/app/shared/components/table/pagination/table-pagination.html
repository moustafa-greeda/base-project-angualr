<div
  class="flex flex-wrap items-center justify-between gap-3 border-t border-[var(--border-color)] px-4 py-3"
>
  <span class="text-[13px] text-[var(--muted)]">
    عرض {{ rangeStart() }} إلى {{ rangeEnd() }} من {{ totalCount() }} نتائج
  </span>

  <div class="flex items-center gap-1.5">
    <button
      type="button"
      (click)="goTo(currentPage() - 1)"
      [disabled]="currentPage() === 1"
      class="grid size-9 cursor-pointer place-items-center rounded-lg border border-[var(--border-color)] text-[var(--text-color)] transition-colors hover:bg-[var(--row-hover)] disabled:pointer-events-none disabled:opacity-40"
      aria-label="السابق"
    >
      <i class="bi bi-chevron-left rtl:-scale-x-100"></i>
    </button>

    @for (p of pageItems(); track $index) {
      @if (p === '…') {
        <span class="grid size-9 select-none place-items-center text-sm text-[var(--muted)]">…</span>
      } @else {
        <button
          type="button"
          (click)="goTo(p)"
          class="grid size-9 cursor-pointer place-items-center rounded-lg border text-sm transition-colors"
          [class]="
            p === currentPage()
              ? 'border-[var(--primary)] bg-[var(--primary)] font-semibold text-white'
              : 'border-[var(--border-color)] text-[var(--text-color)] hover:bg-[var(--row-hover)]'
          "
        >
          {{ p }}
        </button>
      }
    }

    <button
      type="button"
      (click)="goTo(currentPage() + 1)"
      [disabled]="currentPage() === totalPages()"
      class="grid size-9 cursor-pointer place-items-center rounded-lg border border-[var(--border-color)] text-[var(--text-color)] transition-colors hover:bg-[var(--row-hover)] disabled:pointer-events-none disabled:opacity-40"
      aria-label="التالي"
    >
      <i class="bi bi-chevron-right rtl:-scale-x-100"></i>
    </button>
  </div>

  <label class="flex items-center gap-2 text-[13px] text-[var(--muted)]">
    لكل صفحة
    <select
      (change)="pageSizeChange.emit(+$any($event.target).value)"
      class="cursor-pointer rounded-lg border border-[var(--border-color)] bg-[var(--card-bg)] px-2 py-1.5 text-sm text-[var(--text-color)] outline-none"
    >
      @for (opt of pageSizeOptions(); track opt) {
        <option [value]="opt" [selected]="opt === pageSize()">{{ opt }}</option>
      }
    </select>
  </label>
</div>
