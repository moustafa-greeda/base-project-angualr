<div class="grid min-h-[70vh] w-full place-items-center px-4 py-10">
  <div class="flex w-full max-w-lg flex-col items-center text-center">
    <!-- big code with a soft glow behind it -->
    <div class="relative mb-2">
      <span
        class="absolute inset-0 -z-10 blur-3xl opacity-25"
        [class]="accentBg()"
        aria-hidden="true"
      ></span>
      <p class="text-[110px] font-extrabold leading-none tracking-tight" [class]="accentText()">
        {{ code() }}
      </p>
    </div>

    <!-- icon badge -->
    <span
      class="mb-5 grid size-14 place-items-center rounded-full"
      [class]="accentSoft()"
    >
      <i [class]="icon()" class="text-2xl"></i>
    </span>

    <h1 class="mb-2 text-xl font-semibold text-[var(--text-color)]">{{ title() }}</h1>
    <p class="mb-8 max-w-md text-sm leading-relaxed text-[var(--muted)]">{{ message() }}</p>

    <div class="flex flex-wrap items-center justify-center gap-3">
      <app-button
        [titleBtn]="homeLabel()"
        icon="bi bi-house-door"
        [link]="homeLink()"
      />
      <app-button
        titleBtn="Go back"
        variant="outline"
        icon="bi bi-arrow-right rtl:rotate-180"
        (clickAction)="goBack()"
      />
    </div>
  </div>
</div>
