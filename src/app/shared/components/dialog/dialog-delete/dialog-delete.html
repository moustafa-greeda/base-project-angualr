<app-dialog [open]="open()" [title]="title()" [size]="'sm:max-w-md'" (closed)="close()">
  <!-- body -->
  <div class="flex items-start gap-3 p-6">
    <span class="grid size-10 shrink-0 place-items-center rounded-full bg-red-500/10 text-red-500">
      <i class="bi bi-exclamation-triangle"></i>
    </span>
    <p class="pt-2 text-sm leading-relaxed text-[var(--text-color)]">{{ message() }}</p>
  </div>

  <!-- footer -->
  <div class="flex justify-end gap-3 border-t border-[var(--border-color)] px-6 py-4">
    <app-button titleBtn="Cancel" variant="outline" (clickAction)="close()" />
    <app-button titleBtn="Delete" variant="danger" icon="bi bi-trash" (clickAction)="confirm()" />
  </div>
</app-dialog>
