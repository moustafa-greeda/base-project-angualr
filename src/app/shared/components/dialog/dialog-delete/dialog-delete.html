@if (open()) {
<div class="container-form">
  <div class="backdrop" (click)="close()"></div>
  <div class="dialog p-6 relative rounded-xl shadow-lg space-y-5 bg-[var(--card-bg)]">
    <h2 class="text-xl font-semibold text-[var(--text-error)]">{{ title() }}</h2>
    <p>Are you sure you want to delete this item {{ message() }}?</p>
    <div class="flex justify-end pt-4 space-x-3">
      <button (click)="close()" class="bg-gray-300 text-black px-4 py-2 rounded-lg hover:bg-gray-400">
        Cancel
      </button>
      <button (click)="confirm()" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700">
        Delete
      </button>
    </div>
  </div>
</div>
}
