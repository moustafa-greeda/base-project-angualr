<div (appClickOutside)="close()">
  <!-- trigger: flag of the active language + its short code -->
  <button
    type="button"
    class="icon-btn icon-btn--wide"
    (click)="toggle()"
    [attr.aria-label]="'Change language — ' + activeLanguage().label"
    [attr.aria-expanded]="open()"
    [title]="activeLanguage().label"
  >
    <img
      [src]="activeLanguage().flag"
      [alt]="activeLanguage().label"
      width="20"
      height="14"
      class="rounded-[2px] object-cover"
    />
    <span class="text-xs font-semibold">{{ activeLanguage().short }}</span>
  </button>

  @if (open()) {
    <div
      class="animate-dropdown-in absolute end-0 top-[calc(100%+10px)] z-50 w-48 overflow-hidden rounded-2xl border border-[var(--border-color)] bg-[var(--card-bg)] shadow-2xl"
      role="menu"
    >
      <ul class="py-1.5">
        @for (l of languages; track l.code) {
          <li>
            <button
              type="button"
              role="menuitemradio"
              [attr.aria-checked]="current() === l.code"
              (click)="select(l.code)"
              class="flex w-full cursor-pointer items-center gap-3 px-4 py-2.5 text-sm transition-colors hover:bg-[var(--row-hover)]"
              [class]="
                current() === l.code
                  ? 'font-medium text-[var(--primary)]'
                  : 'text-[var(--text-color)]'
              "
            >
              <img
                [src]="l.flag"
                [alt]="l.label"
                width="24"
                height="17"
                class="shrink-0 rounded-[2px] object-cover"
              />
              <span class="flex-1 text-start">{{ l.label }}</span>
              @if (current() === l.code) {
                <i class="bi bi-check-lg shrink-0"></i>
              }
            </button>
          </li>
        }
      </ul>
    </div>
  }
</div>
