<!-- KPI Cards -->
<app-page-header [title]="'Dashborad Admin'" />
<div class="kpi-grid grid grid-cols-[repeat(auto-fit,minmax(250px,1fr))] gap-4 -">
  @for (item of kpis(); track $index) {
    <app-card-kpi
      [icon]="item.icon"
      [title]="item.title"
      [count]="item.value"
      [rate]="item.growthText"
    />
  }
</div>
