<div class="tasks-container">
<!-------------- page header for title & button add  -->
  <app-page-header
    [title]="'item'"
    [titleBtn]="'add item'"
    [icon]="'bi bi-plus-circle'"
    (clickBtn)="openForm()"
  /> 
<!------------------ page table ----------------------->
<app-table-spacer>
  <ng-container table-header>
    <th>ID</th>
    <th>User ID</th>
    <th>Status/Name</th>
    <th>Description</th>
    <th>Actions</th>
  </ng-container>

    <ng-container table-body>
      @for (task of tasks(); track task.id) {
      <tr>
        <td>{{ task.id }}</td>
        <td>{{ task.userId }}</td>
        <td>
          <span [ngClass]="getStatusClass(task.name)"> {{ task.name }}
          </span>
        </td>
        <td>{{ task.discription }}</td>
        <td>
          <div class="actions">
            <button class="btn-edit">
              <i class="bi bi-pencil-square"></i>
            </button>
            <button class="btn-delete">
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </td>
      </tr>
      } @empty {
      <tr>
        <td colspan="5" class="empty">No tasks available right now.</td>
      </tr>
      }
    </ng-container>
    </app-table-spacer>
    <!------------------ form add ----------------------->
  <app-task-form [task]="selectedTask()" (submitForm)="onConfirmForm($event)" />
  <!-- <app-delete [task]="selectedTask()" (confirmDelete)="onConfirmDelete()" /> -->
</div>
