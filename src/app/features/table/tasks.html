<div class="tasks-container">
  <div class="tasks-header">
    <h2>Tasks</h2>
    <button class="btn-add bg-(--primary) rounded-2xl px-8 py-2 my-2" (click)="openForm()">
      + Add Task
    </button>
  </div>

  <app-table [data]="data()" [columns]="columns" />

  <app-task-form [task]="selectedTask()" (submitForm)="onConfirmForm($event)" />

  <!-- <app-delete [task]="selectedTask()" (confirmDelete)="onConfirmDelete()" /> -->
</div>
